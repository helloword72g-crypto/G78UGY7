databases:
  - name: crypto-sultan-db
    plan: free
    databaseName: crypto_sultan
    user: crypto_sultan_user

services:
  - type: web
    name: crypto-sultan
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-sultan-db
          property: connectionString
