  document.querySelectorAll('[data-wa-track]').forEach(el => {
    el.addEventListener('click', () => trackClick(el.getAttribute('data-wa-track')));
  });

  // Mobile hamburger menu
  const burger = document.getElementById('navBurger');
  const mobileMenu = document.getElementById('mobileMenu');
  burger.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => { mobileMenu.classList.remove('open'); burger.setAttribute('aria-expanded','false'); });
  });

  // Scroll-reveal animation for sections
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window){
    const revealTargets = document.querySelectorAll('.section-eyebrow, .cards-grid, .steps, .chip-grid, .pay-grid, .test-grid, #faqList, .trust-strip, .trust-checklist');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    revealTargets.forEach(el => { el.classList.add('reveal'); io.observe(el); });
  }

  // Animated stat counters
  const statEls = document.querySelectorAll('.stat-num');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function animateCount(el){
    const target = parseFloat(el.getAttribute('data-count'));
    const prefix = el.getAttribute('data-prefix') || '';
    const suffix = el.getAttribute('data-suffix') || '';
    if(reduceMotion){ el.textContent = prefix + target + suffix; return; }
    const duration = 1100;
    const start = performance.now();
    function frame(now){
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(target * eased);
      el.textContent = prefix + current + suffix;
      if(progress < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  if('IntersectionObserver' in window && statEls.length){
    const statIo = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){ animateCount(entry.target); statIo.unobserve(entry.target); }
      });
    }, { threshold: 0.4 });
    statEls.forEach(el => statIo.observe(el));
  }

  document.querySelectorAll('.faq-item').forEach(item => {
    const q = item.querySelector('.faq-q');
    const a = item.querySelector('.faq-a');
    q.addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(o => {
        o.classList.remove('open');
        o.querySelector('.faq-a').style.maxHeight = null;
      });
      if(!isOpen){ item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
    });
  });

  const rateValueEl = document.getElementById('rateValue');
  const rateChangeEl = document.getElementById('rateChange');
  const sparklineEl = document.getElementById('sparkline');
  const sparklinePoly = sparklineEl.querySelector('polyline');
  const history = Array(24).fill(settings.baseRate);

  function drawSparkline(){
    const min = Math.min(...history), max = Math.max(...history);
    const range = (max - min) || 0.01;
    const pts = history.map((v, i) => {
      const x = (i / (history.length - 1)) * 200;
      const y = 34 - ((v - min) / range) * 30 - 2;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    sparklinePoly.setAttribute('points', pts);
    const trendUp = history[history.length - 1] >= history[0];
    sparklinePoly.style.stroke = trendUp ? 'var(--up)' : 'var(--down)';
  }

  function tick(){
    const drift = (Math.random()-0.5)*0.08;
    rate = Math.max(settings.baseRate-0.6, Math.min(settings.baseRate+0.6, rate+drift));
    const pct = (((rate-settings.baseRate)/settings.baseRate)*100).toFixed(2);
    rateValueEl.textContent = rate.toFixed(2);
    rateChangeEl.textContent = `${pct>=0?'▲':'▼'} ${Math.abs(pct)}% today`;
    rateChangeEl.style.color = pct>=0 ? 'var(--up)' : 'var(--down)';
    history.push(rate);
    history.shift();
    drawSparkline();
  }
  tick();
  setInterval(tick, 5000);

  trackVisit();
}
