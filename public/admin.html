<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Crypto Sultan</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E11; --bg-2:#14171C; --gold:#F0C75E; --gold-deep:#C9971E; --binance-yellow:#F0B90B;
    --text:#EAECEF; --text-muted:#848E9C; --line:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.04); --glass-brd:rgba(255,255,255,.09);
    --wa:#25D366; --danger:#E85C5C; --up:#0ECB81;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 50% 40% at 85% 0%, rgba(240,185,11,.08), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .logo-mark{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(240,199,94,.35);flex:none;}
  .logo-mark.lg{width:56px;height:56px;margin:0 auto 16px;display:block;}
  .logo{font-family:'Space Grotesk';font-weight:700;font-size:18px;}
  .brand{display:flex;align-items:center;gap:10px;}

  .admin-wrap{max-width:920px;margin:0 auto;padding:32px 24px 80px;width:100%;}
  .admin-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:14px;}
  .pill-btn{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-brd);color:var(--text-muted);font-size:13px;padding:9px 16px;border-radius:999px;}
  .pill-btn:hover{color:var(--text);border-color:var(--gold);}

  .login-box{max-width:380px;margin:80px auto;text-align:center;}
  .login-box .glass-card{padding:36px 30px;}
  .login-box h2{font-size:22px;margin-bottom:8px;font-family:'Space Grotesk';}
  .login-box p{color:var(--text-muted);font-size:13.5px;margin-bottom:24px;}
  .field{margin-bottom:16px;text-align:left;}
  .field label{display:block;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .field input{width:100%;padding:13px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);color:var(--text);font-size:15px;}
  .field input:focus{border-color:var(--gold);}
  .btn-gold{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(90deg,#F0C75E,#C9971E);color:#0A0B0F;font-weight:700;font-size:15px;}
  .btn-gold:hover{filter:brightness(1.06);}
  .error-text{color:var(--danger);font-size:13px;margin-top:8px;}

  .glass-card{background:var(--bg-2);border:1px solid var(--glass-brd);border-radius:10px;}

  .admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  @media (max-width:820px){.admin-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{padding:22px;transition:transform .2s ease, border-color .2s ease;}
  .stat-card:hover{transform:translateY(-3px);border-color:rgba(240,199,94,.3);}
  .stat-card .lbl{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  .stat-card .val{font-family:'Space Grotesk';font-size:28px;font-weight:700;}
  .stat-card .val small{font-size:13px;color:var(--text-muted);font-weight:500;}

  .panel-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:34px 0 14px;}
  .settings-card{padding:26px;}
  .settings-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:640px){.settings-row{grid-template-columns:1fr;}}
  .settings-actions{display:flex;gap:12px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .btn-save{padding:12px 24px;border-radius:9px;border:none;background:linear-gradient(90deg,#F0C75E,#C9971E);color:#0A0B0F;font-weight:700;font-size:14px;transition:transform .15s ease, box-shadow .15s ease;box-shadow:0 6px 18px rgba(240,199,94,.2);}
  .btn-save:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(240,199,94,.3);}
  .btn-save:active{transform:translateY(0);}
  .save-msg{font-size:13px;color:#2ECC71;}

  table.visit-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.visit-table th{text-align:left;font-family:'JetBrains Mono';font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:12px 14px;border-bottom:1px solid var(--line);}
  table.visit-table td{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--text);}
  table.visit-table tbody tr{transition:background .15s ease;}
  table.visit-table tbody tr:hover{background:rgba(255,255,255,.03);}
  table.visit-table tr:last-child td{border-bottom:none;}
  .empty-row td{color:var(--text-muted);text-align:center;padding:26px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const WA_ICON_SM = '';
let currentSettings = null;

function waLink(number, text){ return `https://wa.me/${number}?text=${encodeURIComponent(text)}`; }
function isValidWaNumber(number){ return /^[1-9][0-9]{9,14}$/.test((number||'').trim()); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+"s ago";
  const m = Math.floor(s/60); if(m<60) return m+"m ago";
  const h = Math.floor(m/60); if(h<24) return h+"h ago";
  const d = Math.floor(h/24); return d+"d ago";
}

async function checkAuth(){
  const r = await fetch('/api/admin/check');
  const d = await r.json();
  return d.authenticated;
}

function renderLogin(err){
  document.getElementById('app').innerHTML = `
    <div class="admin-wrap">
      <div class="login-box">
        <div class="glass-card">
          <img class="logo-mark lg" src="logo.png" alt="Crypto Sultan logo">
          <h2>Admin Login</h2>
          <p>Enter your password to manage rate, WhatsApp number &amp; analytics.</p>
          <div class="field">
            <label>Password</label>
            <input type="password" id="pwInput" placeholder="••••••••">
          </div>
          <button class="btn-gold" id="loginBtn">Login</button>
          ${err ? `<div class="error-text">${err}</div>` : ''}
        </div>
        <p style="margin-top:18px;"><a class="pill-btn" href="/">← Back to site</a></p>
      </div>
    </div>
  `;
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const password = document.getElementById('pwInput').value;
    const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
    if(r.ok){ renderDashboard(); }
    else { renderLogin('Incorrect password. Try again.'); }
  });
  document.getElementById('pwInput').addEventListener('keydown', (e) => { if(e.key==='Enter') document.getElementById('loginBtn').click(); });
}

async function renderDashboard(){
  const [settingsRes, analyticsRes] = await Promise.all([
    fetch('/api/settings'),
    fetch('/api/admin/analytics')
  ]);
  const settings = await settingsRes.json();
  const analytics = await analyticsRes.json();
  currentSettings = settings;

  const rows = (analytics.recentVisits||[]).slice(0,15).map(v => `
    <tr><td>${timeAgo(v.ts)}</td><td>${new Date(v.ts).toLocaleString()}</td><td>${(v.ua||'—').slice(0,60)}</td></tr>
  `).join('') || `<tr class="empty-row"><td colspan="3">No visits recorded yet.</td></tr>`;

  document.getElementById('app').innerHTML = `
    <div class="admin-wrap">
      <div class="admin-topbar">
        <div class="brand"><img class="logo-mark" src="logo.png" alt="Crypto Sultan logo"><span class="logo">Admin Panel</span></div>
        <div style="display:flex;gap:10px;">
          <a class="pill-btn" href="/">View site</a>
          <button class="pill-btn" id="logoutBtn">Log out</button>
        </div>
      </div>

      <div class="admin-grid">
        <div class="glass-card stat-card"><div class="lbl">Total Visits</div><div class="val">${analytics.totalVisits||0}</div></div>
        <div class="glass-card stat-card"><div class="lbl">Today's Visits</div><div class="val">${analytics.todayVisits||0}</div></div>
        <div class="glass-card stat-card"><div class="lbl">WhatsApp Clicks</div><div class="val">${analytics.totalClicks||0}</div></div>
        <div class="glass-card stat-card"><div class="lbl">Click Rate</div><div class="val">${analytics.totalVisits ? Math.round((analytics.totalClicks||0)/analytics.totalVisits*100) : 0}<small>%</small></div></div>
      </div>

      <div class="panel-title">Site Settings</div>
      <div class="glass-card settings-card">
        <div class="settings-row">
          <div class="field">
            <label>WhatsApp Number (with country code, digits only)</label>
            <input type="text" id="waInput" value="${settings.whatsappNumber}" placeholder="e.g. 919876543210">
            <span class="error-text" id="waError" style="display:none;">Enter a valid number: country code + number, 10–15 digits, no + or spaces.</span>
          </div>
          <div class="field">
            <label>USDT Rate (₹)</label>
            <input type="number" step="0.01" id="rateInput" value="${settings.baseRate}" placeholder="97.53">
          </div>
        </div>
        <div class="field">
          <label>Site Name</label>
          <input type="text" id="nameInput" value="${settings.siteName}" placeholder="Crypto Sultan">
        </div>
        <div class="settings-actions">
          <button class="btn-save" id="saveBtn">Save changes</button>
          <button class="pill-btn" id="testWaBtn" type="button">Test WhatsApp link ↗</button>
          <span class="save-msg" id="saveMsg" style="display:none;">Saved ✓ — live on the site now</span>
        </div>
      </div>

      <div class="panel-title">Recent Visitors</div>
      <div class="glass-card" style="padding:6px 18px;overflow-x:auto;">
        <table class="visit-table">
          <thead><tr><th>When</th><th>Timestamp</th><th>Browser</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method:'POST' });
    renderLogin();
  });

  document.getElementById('testWaBtn').addEventListener('click', () => {
    const num = document.getElementById('waInput').value.trim().replace(/[^0-9]/g,'');
    if(!isValidWaNumber(num)){ document.getElementById('waError').style.display='block'; return; }
    document.getElementById('waError').style.display='none';
    window.open(waLink(num, 'Hi, I want to buy USDT.'), '_blank', 'noopener');
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const whatsappNumber = document.getElementById('waInput').value.trim().replace(/[^0-9]/g,'');
    const baseRate = parseFloat(document.getElementById('rateInput').value);
    const siteName = document.getElementById('nameInput').value.trim();

    if(!isValidWaNumber(whatsappNumber)){ document.getElementById('waError').style.display='block'; return; }
    document.getElementById('waError').style.display='none';

    const r = await fetch('/api/admin/settings', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ whatsappNumber, baseRate, siteName })
    });
    if(r.ok){
      const msg = document.getElementById('saveMsg');
      msg.style.display='inline';
      setTimeout(() => msg.style.display='none', 2200);
    } else {
      const d = await r.json();
      alert(d.error || 'Failed to save settings.');
    }
  });
}

(async function init(){
  const authed = await checkAuth();
  if(authed) renderDashboard();
  else renderLogin();
})();
</script>
</body>
</html>
